[workspace]
members = ["cli"]

# Shared by all crates. The release workflow reads the version from here.
[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/atahanyorganci/magika-burn"
license = "Apache-2.0"
authors = ["Atahan Yorgancı <atahanyorganci@hotmail.com>"]

[package]
name = "magika-burn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Google's Magika file content type detection in pure Rust. Runs natively and in WebAssembly."
repository.workspace = true
documentation = "https://docs.rs/magika-burn"
license.workspace = true
keywords = ["magika", "file-type", "mime-type", "content-type", "wasm"]
categories = ["filesystem", "wasm", "science"]
authors.workspace = true
readme = "README.md"
# model.onnx is only read by scripts/prepare_model.py.
include = [
    "/src",
    "/build.rs",
    "/assets/LICENSE",
    "/assets/README.md",
    "/assets/content_types_kb.min.json",
    "/assets/models/standard_v3_3/config.min.json",
    "/assets/models/standard_v3_3/weights.f32",
    "/README.md",
    "/LICENSE",
]

[package.metadata.docs.rs]
all-features = true

[features]
# Serialize/Deserialize for the public types (content types as their labels).
serde = ["dep:serde"]

[lib]
# cdylib for wasm-bindgen, rlib for Rust users and tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Must exactly match `wasm-bindgen-cli` from the Nix shell.
wasm-bindgen = "=0.2.127"
# Plain JavaScript objects for predictions and content type information.
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Reads the ends of a Uint8Array without copying all of it into WebAssembly memory.
js-sys = "0.3"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
flate2 = "1"
serde_json = "1"

# The forward pass takes seconds per sample without optimizations, so optimize
# it, and the dependencies the tests use, in debug builds too.
[profile.dev.package.magika-burn]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
