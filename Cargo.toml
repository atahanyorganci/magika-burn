[package]
name = "magika-burn"
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
description = "Google's Magika file content type detection in pure Rust, powered by Burn. Runs natively and in WebAssembly."
repository = "https://github.com/atahanyorganci/magika-burn"
documentation = "https://docs.rs/magika-burn"
license = "Apache-2.0"
keywords = ["magika", "file-type", "mime-type", "content-type", "wasm"]
categories = ["filesystem", "wasm", "science"]
authors = ["Atahan Yorgancı <atahanyorganci@hotmail.com>"]
readme = "README.md"
include = ["/src", "/build.rs", "/assets", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true

[features]
# Serialize/Deserialize for the public types (content types as their labels).
serde = ["dep:serde"]

[lib]
# cdylib for wasm-bindgen, rlib for Rust users and tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# `default-features = false` keeps training/autodiff out of the build. It also
# disables Flex's default features, so they are selected on `burn-flex` below.
burn = { version = "0.21", default-features = false, features = ["std", "flex"] }
burn-flex = { version = "0.21", default-features = false, features = ["std", "simd"] }
burn-store = { version = "0.21", default-features = false, features = ["burnpack"] }
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
burn-flex = { version = "0.21", default-features = false, features = ["std", "simd", "rayon"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# burn -> rand -> getrandom needs a browser entropy source on wasm32-unknown-unknown.
getrandom = { version = "0.4", features = ["wasm_js"] }
# Must exactly match `wasm-bindgen-cli` from the Nix shell.
wasm-bindgen = "=0.2.127"
# Plain JavaScript objects for predictions and content type information.
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[build-dependencies]
burn-onnx = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
flate2 = "1"
serde_json = "1"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
