name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Nix checks (formatting)
        run: nix flake check

      - name: Rust formatting
        run: nix develop --command cargo fmt --check

      - name: Clippy
        run: |
          nix develop --command cargo clippy --all-targets --all-features -- -D warnings
          nix develop --command cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings

      - name: Rust tests
        run: nix develop --command cargo test --all-features

      - name: Licenses
        run: nix develop --command cargo deny check licenses

      - name: Build the npm package
        run: |
          nix develop --command pnpm install --frozen-lockfile
          nix develop --command pnpm run build

      - name: Test the npm package
        run: nix develop --command pnpm test
